name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=gold&color_dots=%23FFF5CC,%23FFE082,%23FFCA28,%23F59E0B,%23C2410C
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=gold&color_dots=%233A2A08,%2370500D,%23B47A14,%23EFB52D,%23FFE066
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
